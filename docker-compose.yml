services:
  backend:
    build:
      context: ./apps/backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./apps/frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
