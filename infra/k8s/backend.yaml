apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: multicloud-platform-console
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: multicloud-platform-console
      component: backend
  template:
    metadata:
      labels:
        app: multicloud-platform-console
        component: backend
    spec:
      containers:
        - name: backend
          image: multicloud-platform-console-backend:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: multicloud-platform-console
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
